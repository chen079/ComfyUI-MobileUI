<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#18181b">
<title>ComfyUI WebUI</title>
<link rel="stylesheet" href="/webui/static/style.css">
</head>
<body data-tab="params">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.5 13.9 9 19.5 11 13.9 13 12 18.5 10.1 13 4.5 11 10.1 9Z"/><path d="M19 3v3M17.5 4.5h3"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="8.5" cy="8.5" r=".6"/><circle cx="15.5" cy="15.5" r=".6"/><circle cx="15.5" cy="8.5" r=".6"/><circle cx="8.5" cy="15.5" r=".6"/><circle cx="12" cy="12" r=".6"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8"/><path d="m21 15-4-4-9 9"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 4.5-9 4.5-9-4.5Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
</svg>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><svg><use href="#i-layers"/></svg></span>
      <span>ComfyUI <b>WebUI</b></span>
    </div>
    <label class="search">
      <svg><use href="#i-search"/></svg>
      <input id="side-search" type="search" placeholder="搜索工作流" autocomplete="off">
    </label>
    <div id="side-cats" class="chips"></div>
    <nav id="side-list" class="wf-list" aria-label="工作流"></nav>
  </aside>

  <header class="topbar">
    <button id="workflow-btn" type="button" aria-haspopup="dialog">
      <span class="brand-mark"><svg><use href="#i-layers"/></svg></span>
      <span class="wf-btn-text">
        <span id="top-cat" class="eyebrow"></span>
        <span id="top-name">选择工作流</span>
      </span>
      <svg class="i-sm"><use href="#i-chevron"/></svg>
    </button>
  </header>

  <main class="workspace">
    <section class="panel">
      <div class="panel-head">
        <div id="panel-cat" class="eyebrow"></div>
        <h1 id="panel-name">选择工作流</h1>
      </div>
      <form id="params-form" onsubmit="return false">
        <div id="prompt-params"></div>
        <div id="common-wrap">
          <div class="section-label">参数</div>
          <div id="common-params" class="grid"></div>
        </div>
        <details id="other-params" hidden>
          <summary class="section-label">
            <svg class="i-sm"><use href="#i-chevron"/></svg>
            其他参数 <span id="other-count" class="count"></span>
          </summary>
          <label class="search small">
            <svg><use href="#i-search"/></svg>
            <input id="other-filter" type="search" placeholder="筛选参数" autocomplete="off">
          </label>
          <div id="other-params-body" class="grid"></div>
        </details>
      </form>
    </section>

    <div class="actionbar">
      <div class="tabs" role="tablist">
        <button type="button" data-tab="params" role="tab"><svg><use href="#i-sliders"/></svg><span>参数</span></button>
        <button type="button" data-tab="result" role="tab"><svg><use href="#i-image"/></svg><span>结果</span><i id="tab-dot" hidden></i></button>
      </div>
      <button id="run-btn" type="button" disabled>
        <svg id="run-icon"><use href="#i-sparkle"/></svg>
        <span id="run-label">生成</span>
        <kbd>Ctrl ↵</kbd>
      </button>
    </div>

    <section class="stage">
      <div id="banner" class="banner" hidden></div>
      <div id="canvas" class="canvas">
        <div id="canvas-empty" class="canvas-empty">
          <svg><use href="#i-image"/></svg>
          <p>调整参数后点击 <b>生成</b></p>
        </div>
        <img id="canvas-img" alt="" hidden>
        <div id="overlay" class="overlay" hidden>
          <span class="spinner"></span>
          <span id="overlay-text">排队中…</span>
          <span class="bar"><span id="overlay-bar"></span></span>
        </div>
      </div>
      <div class="history" id="history-wrap" hidden>
        <div class="history-head">
          <span>历史</span>
          <button id="history-clear" type="button" class="ghost"><svg><use href="#i-trash"/></svg>清空</button>
        </div>
        <div id="history" class="history-strip"></div>
      </div>
    </section>
  </main>
</div>

<div id="picker" class="sheet" role="dialog" aria-modal="true" aria-label="选择工作流" hidden>
  <div class="sheet-body">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="picker-search" type="search" placeholder="搜索工作流" autocomplete="off">
      </label>
      <button id="picker-close" type="button" class="icon-btn" aria-label="关闭"><svg><use href="#i-x"/></svg></button>
    </div>
    <div id="picker-cats" class="chips"></div>
    <nav id="picker-list" class="wf-list"></nav>
  </div>
</div>

<div id="viewer" class="viewer" hidden>
  <img id="viewer-img" alt="">
  <div class="viewer-tools">
    <span id="viewer-count"></span>
    <a id="viewer-download" class="icon-btn" download title="下载"><svg><use href="#i-download"/></svg></a>
    <a id="viewer-open" class="icon-btn" target="_blank" rel="noopener" title="新标签页打开"><svg><use href="#i-external"/></svg></a>
    <button id="viewer-close" type="button" class="icon-btn" title="关闭"><svg><use href="#i-x"/></svg></button>
  </div>
  <button id="viewer-prev" type="button" class="icon-btn nav prev" aria-label="上一张"><svg><use href="#i-left"/></svg></button>
  <button id="viewer-next" type="button" class="icon-btn nav next" aria-label="下一张"><svg><use href="#i-right"/></svg></button>
</div>

<script src="/webui/static/app.js"></script>
</body>
</html>
